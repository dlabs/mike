# MikeOSS v2 - Coolify deployment (d.labs).
# Based on upstream docker-compose.yml at v2.0.0, with:
#  - all host port bindings removed (Coolify/Traefik routes by domain)
#  - Supabase JWT secret + anon/service keys taken from env (no demo values)
#  - RustFS credentials taken from env
#  - bucket CORS generated from FRONTEND_URL (no bind-mounted JSON)
#  - SMTP configurable from env (defaults to the internal Mailpit catcher)
#  - env_file replaced by explicit environment so Coolify shows every variable
#
# Public domains (set in Coolify per service):
#   frontend -> https://<app-host>:3000
#   gateway  -> https://<auth-host>:8000   (auth confirmation / OAuth links)
#   storage  -> https://<s3-host>:9000     (browser direct uploads, signed URLs)
#
# NOTE: internal Postgres role passwords stay 'postgres' (set by
# docker/db-init/roles.sql). The DB is not published on any port.

services:
  db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXP: 3600
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init/roles.sql:/docker-entrypoint-initdb.d/zz-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  auth:
    image: supabase/gotrue:v2.189.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:?}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: ${FRONTEND_URL:?}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:?}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL:?}/auth/v1/callback
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@mike.local}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Mike}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v14.12
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    volumes:
      - ./supabase/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - rest
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/rest/v1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-init:
    image: supabase/postgres:17.6.1.136
    exclude_from_hc: true
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      DB: postgres://postgres:postgres@db:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./backend/schema.sql:/schema.sql:ro
      - ./backend/migrations:/migrations:ro
      - ./backend/scripts/migrate.sh:/migrate.sh:ro
      - ./docker/db-init/adopt-ledger.sh:/adopt-ledger.sh:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        until psql "$$DB" -tAc "select to_regclass('auth.users')" | grep -q auth; do
          echo "waiting for auth schema..."; sleep 2;
        done
        if ! psql "$$DB" -tAc "select to_regclass('public.user_profiles')" | grep -q user_profiles; then
          psql "$$DB" -v ON_ERROR_STOP=1 -f /schema.sql || exit 1;
        elif ! psql "$$DB" -tAc "select to_regclass('public.schema_migrations')" | grep -q schema_migrations; then
          bash /adopt-ledger.sh || exit 1;
        fi
        bash /migrate.sh up || exit 1;
        psql "$$DB" -c "grant usage on schema public to service_role;
          grant all privileges on all tables in schema public to service_role;
          grant all privileges on all sequences in schema public to service_role;
          notify pgrst, 'reload schema';"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?}
    volumes:
      - storage_data:/data
    restart: unless-stopped

  createbucket:
    image: amazon/aws-cli
    exclude_from_hc: true
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      CORS_ORIGIN: ${FRONTEND_URL:?}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until aws --endpoint-url http://storage:9000 s3 ls; do echo 'waiting for storage'; sleep 2; done
        aws --endpoint-url http://storage:9000 s3 mb s3://mike || true
        printf '{"CORSRules":[{"AllowedOrigins":["%s"],"AllowedMethods":["PUT","HEAD"],"AllowedHeaders":["Content-Type","x-amz-*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}' "$$CORS_ORIGIN" > /tmp/cors.json
        aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket mike --cors-configuration file:///tmp/cors.json
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  workflow-sync:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mike-backend:local
    exclude_from_hc: true
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - FRONTEND_URL=${FRONTEND_URL:?}
      - API_PUBLIC_URL=${API_PUBLIC_URL:?}
      - DOWNLOAD_SIGNING_SECRET=${DOWNLOAD_SIGNING_SECRET:?}
      - USER_API_KEYS_ENCRYPTION_SECRET=${USER_API_KEYS_ENCRYPTION_SECRET:?}
      - SUPABASE_URL=http://gateway:8000
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:?}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:?}
      - R2_ENDPOINT_URL=http://storage:9000
      - R2_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY:?}
      - R2_SECRET_ACCESS_KEY=${STORAGE_SECRET_KEY:?}
      - R2_BUCKET_NAME=mike
      - MIKE_WORKFLOWS_REPOSITORY=${MIKE_WORKFLOWS_REPOSITORY:-Open-Legal-Products/mike-workflows}
      - MIKE_WORKFLOWS_REF=${MIKE_WORKFLOWS_REF:-main}
      - SENTRY_DISABLED=${SENTRY_DISABLED:-true}
    command: ["npm", "run", "sync:workflows"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: mike-backend:local
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - FRONTEND_URL=${FRONTEND_URL:?}
      - API_PUBLIC_URL=${API_PUBLIC_URL:?}
      - DOWNLOAD_SIGNING_SECRET=${DOWNLOAD_SIGNING_SECRET:?}
      - USER_API_KEYS_ENCRYPTION_SECRET=${USER_API_KEYS_ENCRYPTION_SECRET:?}
      - MCP_CONNECTORS_ENCRYPTION_SECRET=${MCP_CONNECTORS_ENCRYPTION_SECRET:-}
      - MANIFEST_SIGNING_KEY=${MANIFEST_SIGNING_KEY:-}
      - SUPABASE_URL=http://gateway:8000
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:?}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:?}
      - R2_ENDPOINT_URL=http://storage:9000
      - R2_PUBLIC_ENDPOINT_URL=${R2_PUBLIC_ENDPOINT_URL:?}
      - R2_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY:?}
      - R2_SECRET_ACCESS_KEY=${STORAGE_SECRET_KEY:?}
      - R2_BUCKET_NAME=mike
      - REDIS_URL=redis://redis:6379
      - ASYNC_DOCUMENT_CONVERSION=${ASYNC_DOCUMENT_CONVERSION:-true}
      - ASYNC_TABULAR_EXTRACTION=${ASYNC_TABULAR_EXTRACTION:-true}
      - WORKERS_MODE=${WORKERS_MODE:-thread}
      - SSO_ENABLED=${SSO_ENABLED:-false}
      - SENTRY_DISABLED=${SENTRY_DISABLED:-true}
      # Model providers (all optional - users can also add keys in Settings)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - BEDROCK_AWS_REGION=${BEDROCK_AWS_REGION:-}
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      # Optional web search
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      workflow-sync:
        condition: service_completed_successfully
      auth:
        condition: service_started
      rest:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DISABLED: ${SENTRY_DISABLED:-true}
        GIT_SHA: ${GIT_SHA:-}
    environment:
      - API_BASE_URL=http://backend:3001
      - SENTRY_DISABLED=${SENTRY_DISABLED:-true}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
  redis_data:
