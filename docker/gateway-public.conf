# Public gateway (d.labs Coolify deploy): exposes ONLY Supabase Auth (/auth/v1).
# The full gateway on :8000 (auth + PostgREST) stays internal for the backend.
# Browsers never need /rest/v1 - Mike's frontend talks to its own /api.

server {
  listen 8001;
  server_name _;
  client_max_body_size 1m;
  resolver 127.0.0.11 ipv6=off valid=10s;

  # GoTrue admin API is for service_role only - never from the internet.
  location /auth/v1/admin {
    return 404;
  }

  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;

    set $auth_upstream auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass http://$auth_upstream;
  }

  location / {
    return 404;
  }
}
